<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Taste the World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed photographic globe; destinations ride a rail along the bottom; a story panel slides in from the right (bottom sheet on phones) after the camera lands. */
:root{
  --space:#05070d;
  --ink:#f4efe7;
  --muted:#9ea6b6;
  --crust:#ff6b35;
  --glaze:#ffcfb3;
  --gold:#ffc857;
  --panel:rgba(9,12,20,.82);
  --line:rgba(244,239,231,.12);
  --f-display:"Syne","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--space);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;overflow:hidden}
*{box-sizing:border-box}
.app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto auto}
#stage{position:absolute;inset:0;cursor:grab}
#stage:active{cursor:grabbing}

/* header */
.top{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;pointer-events:none}
.brand{display:flex;align-items:baseline;gap:12px;pointer-events:auto}
.brand b{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.home-btn{pointer-events:auto;font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}
.home-btn:hover{border-color:var(--crust);color:var(--glaze)}

/* intro */
.intro{position:relative;z-index:2;align-self:start;max-width:30rem;padding:8px 24px 0;pointer-events:none;transition:opacity .5s,transform .5s}
.intro::before{content:"";position:absolute;left:-24px;right:-40%;top:-20px;bottom:-40px;z-index:-1;background:linear-gradient(105deg,rgba(5,7,13,.78) 0%,rgba(5,7,13,.55) 45%,rgba(5,7,13,0) 100%);pointer-events:none}
.intro h1,.intro p{text-shadow:0 2px 16px rgba(0,0,0,.5)}
.intro h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.4rem,6vw,4.6rem);line-height:.92;letter-spacing:-.02em;margin:0 0 14px;text-wrap:balance}
.intro h1 em{font-style:normal;color:var(--crust)}
.intro p{margin:0;color:var(--muted);max-width:26rem}
.app.flying .intro,.app.open .intro{opacity:0;transform:translateY(-8px)}

/* rail */
.rail{position:relative;z-index:3;padding:0 24px 20px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.stop{flex:0 0 auto;min-width:150px;text-align:left;color:var(--ink);background:rgba(9,12,20,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;display:grid;gap:2px;transition:border-color .2s,background .2s}
.stop:hover{border-color:rgba(255,107,53,.55)}
.stop[aria-pressed="true"]{border-color:var(--crust);background:rgba(255,107,53,.14)}
.stop small{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stop strong{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15}
.stop span{font-size:12px;color:var(--glaze)}
.stop:focus-visible,.home-btn:focus-visible,.close:focus-visible,.cta:focus-visible{outline:2px solid var(--crust);outline-offset:2px}

/* route readout */
.route{position:absolute;z-index:3;left:50%;top:70px;transform:translateX(-50%);font:500 11.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--glaze);background:rgba(9,12,20,.6);border:1px solid var(--line);border-radius:999px;padding:9px 14px;white-space:nowrap;opacity:0;transition:opacity .4s;pointer-events:none;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.app.flying .route,.app.open .route{opacity:1}

/* pins */
.pin{pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px}
.pin i{display:block;width:11px;height:11px;border-radius:50%;background:var(--crust);box-shadow:0 0 0 3px rgba(255,107,53,.25),0 0 18px rgba(255,107,53,.8)}
.pin em{font:600 11px/1 var(--f-mono);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);text-shadow:0 1px 6px rgba(0,0,0,.9);white-space:nowrap}
.pin.active i{background:#fff;box-shadow:0 0 0 4px var(--crust),0 0 26px var(--crust)}

/* story panel */
.panel{position:absolute;z-index:4;top:16px;right:16px;bottom:16px;width:min(420px,calc(100% - 32px));background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;overflow:auto;transform:translateX(calc(100% + 32px));transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.app.open .panel{transform:none}
.panel-in{padding:24px 24px 28px;display:grid;gap:22px}
.p-head{display:flex;justify-content:space-between;align-items:start;gap:12px}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--crust)}
.p-head h2{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,4vw,2.6rem);line-height:.95;letter-spacing:-.02em;margin:8px 0 0;text-wrap:balance}
.coords{font:400 11.5px/1.5 var(--f-mono);color:var(--muted);margin-top:10px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.close{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.close:hover{border-color:var(--crust)}
.sig{border-top:1px solid var(--line);padding-top:18px}
.sig h3{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.2;margin:4px 0 8px}
.sig p{margin:0;color:#d9d3ca}
.label{font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.facts{display:grid;gap:16px}
.fact{display:grid;gap:6px}
.fact p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--ink)}
.funfact{background:rgba(255,107,53,.1);border:1px solid rgba(255,107,53,.35);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.funfact .label{color:var(--glaze)}
.box{border-top:1px solid var(--line);padding-top:18px;display:grid;gap:12px}
.box ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.box li{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.box li span:last-child{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.price{display:flex;align-items:baseline;gap:12px;font-variant-numeric:tabular-nums}
.price b{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1}
.price s{color:var(--muted);font-family:var(--f-mono);font-size:13px}
.price em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--glaze)}
.cta{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:15px;color:#1a0b04;background:var(--crust);border-radius:12px;padding:14px 16px}
.cta:hover{background:#ff7f50}
.note{font-size:12px;color:var(--muted);margin:0}

/* modes + atlas */
.top{flex-wrap:wrap}
.modes{pointer-events:auto;display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(9,12,20,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mode{font:500 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:9px 14px;cursor:pointer}
.mode[aria-pressed="true"]{background:var(--crust);color:#1a0b04}
.mode:focus-visible{outline:2px solid var(--crust);outline-offset:2px}
.finder{position:relative;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:0 24px 10px}
.finder input{flex:0 1 280px;min-width:0;font:500 14px/1 var(--f-body);color:var(--ink);background:rgba(9,12,20,.7);border:1px solid var(--line);border-radius:999px;padding:11px 16px;outline:none}
.finder input:focus{border-color:var(--crust)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--crust)}
.lg.ing::before{background:var(--gold)}
.lg.home::before{background:var(--ink)}
.count{font:500 11px/1 var(--f-mono);color:var(--glaze);letter-spacing:.06em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.stop.small{min-width:120px;padding:9px 12px}
.stop.small strong{font-size:15px}
.stop.k-ingredient small{color:var(--gold)}
.pin.sm i{width:8px;height:8px;box-shadow:0 0 0 2px rgba(255,107,53,.25),0 0 10px rgba(255,107,53,.7)}
.pin.sm.k-ingredient i{background:var(--gold);box-shadow:0 0 0 2px rgba(255,200,87,.25),0 0 10px rgba(255,200,87,.7)}
.pin.sm.k-home i{background:var(--ink);box-shadow:0 0 0 2px rgba(255,255,255,.25),0 0 10px rgba(255,255,255,.7)}
.pin.sm em{opacity:0;transition:opacity .2s;font-size:10px}
.pin.sm:hover em,.pin.sm.active em{opacity:1}
.pin.active i{background:#fff;box-shadow:0 0 0 4px var(--crust),0 0 26px var(--crust)}
.atlas-list li{align-items:start;border-bottom:1px solid var(--line);padding-bottom:10px}
.atlas-list li:last-child{border-bottom:0}
.atlas-list strong{display:block;font-weight:600;font-size:14px;line-height:1.35}
.atlas-list p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.atlas-list li > span{text-align:right;line-height:1.5}

/* readable pins: the dot sits exactly on the spot, the label is a pill beside it */
.pin{position:relative;width:0;height:0;transform:none;display:block}
.pin::before{content:"";position:absolute;left:-20px;top:-20px;width:40px;height:40px;border-radius:50%}
.pin i{position:absolute;left:-6px;top:-6px;width:12px;height:12px}
.pin.sm i{left:-6px;top:-6px;width:12px;height:12px}
.pin em,.pin.sm em{position:absolute;left:14px;top:0;transform:translateY(-50%);opacity:1;font:600 12px/1 var(--f-body);letter-spacing:.01em;text-transform:none;color:var(--ink);text-shadow:none;background:rgba(5,7,13,.8);border:1px solid var(--line);border-radius:999px;padding:6px 10px;white-space:nowrap}
.pin em small{font:500 10.5px/1 var(--f-mono);color:var(--glaze);margin-left:4px}
.pin.s-l em{left:auto;right:14px}
.pin.s-t em{left:0;top:auto;bottom:14px;transform:translateX(-50%)}
.pin.s-b em{left:0;top:14px;transform:translateX(-50%)}
.pin:hover em,.pin.active em{border-color:var(--crust);background:rgba(40,16,6,.92)}
.pin.stamped em::after{content:"✓";margin-left:6px;color:var(--gold)}
.bubble{pointer-events:auto;cursor:pointer;position:relative;width:var(--s);height:var(--s);transform:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(255,107,53,.55),rgba(255,107,53,.18) 70%);border:1.5px solid var(--crust);box-shadow:0 0 0 6px rgba(255,107,53,.12),0 0 30px rgba(255,107,53,.45);transition:transform .2s}
.bubble:hover{transform:scale(1.08)}
.bubble b{font:800 18px/1 var(--f-display);color:#fff}
.bubble span{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font:600 12px/1 var(--f-body);color:var(--ink);background:rgba(5,7,13,.8);border:1px solid var(--line);border-radius:999px;padding:6px 10px;white-space:nowrap}
.passport{pointer-events:auto;display:none;align-items:center;gap:10px;font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:rgba(9,12,20,.55);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.app.atlas .passport{display:flex}
.passport b{color:var(--gold);font-size:13px;font-variant-numeric:tabular-nums}
.passport i{display:block;width:60px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.passport u{display:block;height:100%;width:0;background:var(--gold);transition:width .6s}
.surprise{font:600 13px/1 var(--f-body);color:var(--ink);background:transparent;border:1px solid var(--crust);border-radius:999px;padding:11px 16px;cursor:pointer}
.surprise:hover{background:rgba(255,107,53,.18)}
.surprise:focus-visible,.near-btn:focus-visible{outline:2px solid var(--crust);outline-offset:2px}
.stop.region{min-width:170px}
.stop.region small{color:var(--glaze)}
.stop.back{min-width:130px;border-style:dashed}
.stop.stamped strong::after{content:" ✓";color:var(--gold);font-size:13px}
/* boarding-pass route */
.route{display:flex;gap:18px;align-items:center;font:500 13px/1.2 var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink);padding:10px 18px;border-radius:14px;top:76px}
.route span{display:grid;gap:3px}
.route small{font:500 9.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.route i{font-style:normal;color:var(--crust);font-size:16px}
/* stamp */
.stamp{justify-self:start;width:112px;height:112px;border-radius:50%;border:2.5px solid var(--crust);outline:1px solid rgba(255,107,53,.5);outline-offset:-9px;display:grid;place-content:center;text-align:center;gap:3px;color:var(--crust);transform:rotate(-9deg);font:600 9px/1.1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;padding:10px}
.stamp b{font:800 15px/1 var(--f-display);letter-spacing:.02em;color:var(--glaze);max-width:86px;overflow-wrap:anywhere}
.stamp.fresh{animation:stampIn .5s cubic-bezier(.3,1.6,.5,1) .3s both}
@keyframes stampIn{from{transform:rotate(-20deg) scale(1.8);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}
.near{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:18px}
.near-row{display:flex;flex-wrap:wrap;gap:8px}
.near-btn{font:600 14px/1 var(--f-body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:10px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.near-btn:hover{border-color:var(--crust)}
.near-btn small{font:500 11px/1 var(--f-mono);color:var(--glaze)}
.atlas-list li > span em{display:block;font-style:normal;color:var(--glaze)}
/* bigger, easier reading in the panel */
.sig p,.fact p,.funfact p,.box li{font-size:16px;line-height:1.6}
.funfact p{margin:0}
.atlas-list strong{font-size:15.5px}
.atlas-list p{font-size:14px}
.label{font-size:11.5px}
.stop small{font-size:11px}
.stop strong{font-size:18px}
.stop span{font-size:13px}

@media (max-width:720px){
  .passport{order:2}
  .route{top:118px;gap:12px;font-size:12px;padding:8px 14px}
  .modes{order:3;width:100%;justify-content:center}
  .mode{flex:1}
  .finder{padding:0 16px 8px}
  .legend{display:none}
  .top{padding:14px 16px}
  .brand span{display:none}
  .intro{padding:4px 16px 0}
  .intro p{font-size:14px}
  .rail{padding:0 16px 14px}
  .stop{min-width:132px;padding:10px 12px}
  .route{top:60px}
  .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:66%;transform:translateY(calc(100% + 16px))}
  .panel-in{padding:20px 18px 24px}
}
@media (prefers-reduced-motion:reduce){
  .panel,.intro,.route{transition:none}
}
</style>

<div class="app" id="app">
  <header class="top">
    <a class="brand" href="/" aria-label="Urban Bread Co — home" style="text-decoration:none;color:inherit"><b>Urban Bread Co</b><span>TASTE THE WORLD · THORNTON, CO</span></a>
    <div class="modes" role="group" aria-label="View">
      <button class="mode" type="button" data-mode="boxes" aria-pressed="true">Taste boxes</button>
      <button class="mode" type="button" data-mode="atlas" aria-pressed="false">Full menu atlas</button>
    </div>
    <div class="passport" id="passport" title="Places you've visited in the atlas"><span>Bread Passport</span><b><span id="passN">0</span>/<span id="passT">50</span></b><i><u id="passBar"></u></i></div>
    <button class="home-btn" id="homeBtn" type="button">Back to Thornton</button>
  </header>

  <section class="intro" aria-label="Introduction">
    <h1>Every loaf has a <em>hometown.</em></h1>
    <p>Pick a place below. We'll fly you there, show you where the bread was born, and pack four minis that taste like it.</p>
  </section>

  <div class="finder" id="finder" hidden>
    <label class="sr" for="q">Find a bread</label>
    <input id="q" type="search" placeholder="Find a bread or place" autocomplete="off">
    <span class="legend"><span class="lg born">Born or made famous here</span><span class="lg ing">Key ingredient</span><span class="lg home">Our original</span></span>
    <button class="surprise" id="surprise" type="button">Surprise me</button>
    <span class="count" id="count"></span>
  </div>
  <nav class="rail" id="rail" aria-label="Destinations"></nav>

  <div id="stage" aria-label="Interactive globe. Drag to spin, scroll to zoom."></div>
  <div class="route" id="route" aria-live="polite"></div>

  <aside class="panel" id="panel" aria-label="Destination story" aria-hidden="true">
    <div class="panel-in" id="panelIn"></div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.1/dist/globe.gl.min.js"></script>

function miles(a, b){
  const R = 3958.8, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLng/2)**2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}
function midpoint(a, b){
  const r = Math.PI / 180;
  const la1 = a.lat*r, lo1 = a.lng*r, la2 = b.lat*r, lo2 = b.lng*r;
  const bx = Math.cos(la2) * Math.cos(lo2 - lo1), by = Math.cos(la2) * Math.sin(lo2 - lo1);
  const lat = Math.atan2(Math.sin(la1) + Math.sin(la2), Math.sqrt((Math.cos(la1)+bx)**2 + by**2));
  const lng = lo1 + Math.atan2(by, Math.cos(la1) + bx);
  return { lat: lat / r, lng: lng / r };
}
function fmtCoord(d){
  const ns = d.lat >= 0 ? "N" : "S", ew = d.lng >= 0 ? "E" : "W";
  return `${Math.abs(d.lat).toFixed(4)}° ${ns} · ${Math.abs(d.lng).toFixed(4)}° ${ew}`;
}

  { id:"r-silk", name:"The Silk Road", lat:38.5, lng:58, alt:0.95, places:["giresun","kerman","kabul","almaty"] },
  { id:"r-india", name:"India", lat:16.99, lng:73.31, alt:0.5, places:["ratnagiri"] },
  { id:"r-pacific", name:"Spice Islands & New Guinea", lat:-5.2, lng:137, alt:0.62, places:["banda","kuk"] }
];
const byId = Object.fromEntries(ATLAS.map(a => [a.id, a]));
REGIONS.forEach(r => {
  r.region = true;
  r.items = r.places.map(id => byId[id]);
  r.breadCount = r.items.reduce((t, a) => t + a.breads.length, 0);
  r.items.forEach(a => a.regionId = r.id);
});
const regionOf = id => REGIONS.find(r => r.id === byId[id].regionId);

/* label side for neighbours that would collide when zoomed in */
const SIDE = { gouda:"l", naples:"l", mitcham:"b", london:"t", whitman:"l", boston:"t", capecod:"r", papantla:"t", mexicocity:"l", balsas:"b", hershey:"l", philadelphia:"b", mountvernon:"l", newyork:"b", naugatuck:"t", claxton:"l", treviso:"t", milan:"l", chantilly:"b", amsterdam:"t", xalapa:"r", savannah:"r", georgia:"l" };

/* ---------- passport: stamps live only in this viewer's browser ---------- */
const STAMP_KEY = "ubc-passport-v1";
let stamps = new Set();
try { stamps = new Set(JSON.parse(localStorage.getItem(STAMP_KEY) || "[]")); } catch (e) {}
function stamp(id){
  const fresh = !stamps.has(id);
  stamps.add(id);
  try { localStorage.setItem(STAMP_KEY, JSON.stringify([...stamps])); } catch (e) {}
  updatePassport();
  return fresh;
}
function updatePassport(){
  const n = ATLAS.filter(a => stamps.has(a.id)).length;
  document.getElementById("passN").textContent = n;
  document.getElementById("passT").textContent = ATLAS.length;
  document.getElementById("passBar").style.width = (n / ATLAS.length * 100) + "%";
}
const today = new Date().toLocaleDateString("en-US", { day:"2-digit", month:"short", year:"numeric" }).toUpperCase();

/* ---------- modes, rail, finder ---------- */
let mode = "boxes", region = null, current = null, timers = [];
const finder = document.getElementById("finder");
const q = document.getElementById("q");
const countEl = document.getElementById("count");

function card(d){
  const b = document.createElement("button");
  b.type = "button"; b.id = "stop-" + d.id;
  b.setAttribute("aria-pressed", String(current === d));
  if (d.region){
    b.className = "stop region";
    b.innerHTML = `<small>${d.items.length} place${d.items.length > 1 ? "s" : ""}</small><strong>${d.name}</strong><span>${d.breadCount} bread${d.breadCount > 1 ? "s" : ""}</span>`;
    b.addEventListener("click", () => openRegion(d));
  } else if (d.atlas){
    b.className = "stop small k-" + d.kind + (stamps.has(d.id) ? " stamped" : "");
    b.innerHTML = `<small>${d.kind === "ingredient" ? "Ingredient" : d.kind === "home" ? "Our original" : "Birthplace"}</small><strong>${d.name}</strong><span>${d.breads.length} bread${d.breads.length > 1 ? "s" : ""}</span>`;
    b.addEventListener("click", () => select(d));
  } else {
    b.className = "stop";
    b.innerHTML = `<small>Taste of</small><strong>${d.name}</strong><span>4 minis · $${d.price} <s>$${valueOf(d)}</s></span>`;
    b.addEventListener("click", () => select(d));
  }
  return b;
}

function renderRail(){
  rail.innerHTML = "";
  const f = q.value.trim().toLowerCase();
  if (mode === "boxes"){ DEST.forEach(d => rail.appendChild(card(d))); return; }
  let list;
  if (f){
    list = ATLAS.filter(a => a.name.toLowerCase().includes(f) || a.place.toLowerCase().includes(f) || a.breads.some(b => b[0].toLowerCase().includes(f)));
    countEl.textContent = list.length ? `${list.length} place${list.length > 1 ? "s" : ""} match` : "Nothing matches. Try “banana” or “Italy”.";
  } else if (region){
    const back = document.createElement("button");
    back.type = "button"; back.className = "stop back"; back.id = "stop-back";
    back.innerHTML = `<small>Back</small><strong>← All regions</strong><span>${REGIONS.length} regions</span>`;
    back.addEventListener("click", worldView);
    rail.appendChild(back);
    list = region.items;
    countEl.textContent = `${region.name} · ${region.items.length} places · ${region.breadCount} breads`;
  } else {
    list = REGIONS;
    countEl.textContent = `${ATLAS.reduce((t, a) => t + a.breads.length, 0)} breads · ${ATLAS.length} places · tap a region or anywhere on the globe`;
  }
  list.forEach(d => rail.appendChild(card(d)));
}

function setMode(m){
  if (m === mode) return;
  mode = m;
  document.querySelectorAll(".mode").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  finder.hidden = m !== "atlas";
  app.classList.toggle("atlas", m === "atlas");
  q.value = ""; region = null;
  goHome();
  renderRail();
}
document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
q.addEventListener("input", () => { renderRail(); updateLayer(true); });
document.getElementById("surprise").addEventListener("click", () => {
  const pool = ATLAS.filter(a => !stamps.has(a.id));
  const pick = (pool.length ? pool : ATLAS)[Math.floor(Math.random() * (pool.length || ATLAS.length))];
  select(pick);
});

/* ---------- globe ---------- */
const CLUSTER_ALT = 1.15;
const globe = new Globe(stage, { animateIn: !reduced })
  .globeImageUrl("img/earth-blue-marble.jpg")
  .bumpImageUrl("img/earth-topology.png")
  .backgroundImageUrl("img/night-sky.png")
  .showAtmosphere(true)
  .atmosphereColor("#8db8ff")
  .atmosphereAltitude(0.17)
  .htmlLat(d => d.lat).htmlLng(d => d.lng).htmlAltitude(0.005)
  .htmlElement(d => {
    const el = document.createElement("div");
    if (d.region){
      el.className = "bubble";
      el.style.setProperty("--s", Math.round(48 + d.breadCount * 1.8) + "px");
      el.innerHTML = `<b>${d.breadCount}</b><span>${d.name}</span>`;
      el.title = `Zoom into ${d.name}`;
      el.addEventListener("click", e => { e.stopPropagation(); openRegion(d); });
    } else {
      el.className = "pin" + (d.atlas ? " sm k-" + d.kind + " s-" + (SIDE[d.id] || "r") : "") + (current === d ? " active" : "") + (d.atlas && stamps.has(d.id) ? " stamped" : "");
      el.id = "pin-" + d.id;
      el.innerHTML = `<i></i><em>${d.name}${d.atlas ? ` <small>${d.breads.length}</small>` : ""}</em>`;
      el.addEventListener("click", e => { e.stopPropagation(); select(d); });
    }
    return el;
  })
  .ringColor(() => t => `rgba(255,107,53,${1 - t})`)
  .ringMaxRadius(3.2).ringPropagationSpeed(2.4).ringRepeatPeriod(900)
  .arcColor(() => ["rgba(255,207,179,0.15)", "rgba(255,107,53,1)"])
  .arcStroke(0.55)
  .arcDashLength(0.45).arcDashGap(1.2).arcDashInitialGap(1).arcDashAnimateTime(2600)
  .arcAltitudeAutoScale(0.42)
  .onGlobeClick(({ lat, lng }) => {
    if (mode !== "atlas" || current) return;
    if (globe.pointOfView().altitude > CLUSTER_ALT){
      // tap anywhere: dive toward that spot, then pins take over from bubbles
      controls.autoRotate = false;
      globe.pointOfView({ lat, lng, altitude: 0.8 }, reduced ? 0 : 1400);
    }
  });

const controls = globe.controls();
controls.autoRotate = !reduced;
controls.autoRotateSpeed = 0.35;
controls.enableDamping = true;
controls.minDistance = 112;

let layerKey = "";
function updateLayer(force){
  let key, data;
  if (mode === "boxes"){ key = "boxes"; data = DEST; }
  else {
    const f = q.value.trim().toLowerCase();
    const zoomedOut = globe.pointOfView().altitude > CLUSTER_ALT;
    if (f){
      data = ATLAS.filter(a => a.name.toLowerCase().includes(f) || a.place.toLowerCase().includes(f) || a.breads.some(b => b[0].toLowerCase().includes(f)));
      key = "q:" + f;
    } else if (zoomedOut && !current){ key = "regions"; data = REGIONS; }
    else { key = "places"; data = ATLAS; }
  }
  if (!force && key === layerKey) return;
  layerKey = key;
  globe.htmlElementsData(data.slice());
}
if (globe.onZoom) globe.onZoom(() => updateLayer());
else setInterval(() => updateLayer(), 300);

function size(){ globe.width(stage.clientWidth).height(stage.clientHeight); }
size();
window.addEventListener("resize", size);
globe.pointOfView({ lat: 32, lng: -60, altitude: isPhone() ? 3.2 : 2.5 }, 0);
updateLayer(true);
renderRail();
updatePassport();

function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

function landingView(d, alt = 0.42){
  if (isPhone()) return { lat: d.lat - alt * 16, lng: d.lng, altitude: alt };
  return { lat: d.lat, lng: d.lng + alt * 30, altitude: alt };
}

function openRegion(r){
  if (r.items.length === 1) return select(r.items[0]);
  clearTimers();
  current = null; region = r;
  controls.autoRotate = false;
  app.classList.remove("open", "flying");
  panel.setAttribute("aria-hidden", "true");
  globe.arcsData([]).ringsData([]);
  q.value = "";
  renderRail();
  globe.pointOfView({ lat: r.lat, lng: r.lng, altitude: r.alt }, reduced ? 0 : 1600);
}

function worldView(){
  region = null;
  goHome();
  renderRail();
}

function select(d){
  clearTimers();
  current = d;
  if (d.atlas && !q.value) region = regionOf(d.id);
  controls.autoRotate = false;
  renderRail();
  updateLayer(true);
  const stop = document.getElementById("stop-" + d.id);
  if (stop) stop.scrollIntoView({ block: "nearest", inline: "center", behavior: reduced ? "auto" : "smooth" });

  app.classList.remove("open");
  panel.setAttribute("aria-hidden", "true");
  app.classList.add("flying");

  const home = Math.abs(d.lat - HOME.lat) < 0.01 && Math.abs(d.lng - HOME.lng) < 0.01;
  route.innerHTML = home
    ? `<span><small>You're home</small>Thornton, CO</span>`
    : `<span><small>From</small>Thornton, CO</span><i aria-hidden="true">✈</i><span><small>To</small>${d.name}</span><span><small>Distance</small>${miles(HOME, d).toLocaleString()} mi</span>`;

  globe.ringsData([d]).ringLat(r => r.lat).ringLng(r => r.lng);
  globe.arcsData(home ? [] : [{ startLat: HOME.lat, startLng: HOME.lng, endLat: d.lat, endLng: d.lng }]);

  const pov = globe.pointOfView();
  const dist = miles({ lat: pov.lat, lng: pov.lng }, d);
  const t1 = reduced ? 0 : (dist < 600 && pov.altitude < 1 ? 0 : 1300), t2 = reduced ? 0 : 2000;
  if (t1){
    const mid = midpoint({ lat: pov.lat, lng: pov.lng }, d);
    globe.pointOfView({ lat: mid.lat, lng: mid.lng, altitude: Math.max(1.9, Math.min(3, dist / 2600)) }, t1);
  }
  timers.push(setTimeout(() => globe.pointOfView(landingView(d, d.atlas ? 0.3 : 0.42), t2), t1));
  timers.push(setTimeout(() => d.atlas ? openAtlas(d, home) : openPanel(d), t1 + t2 * 0.75));
}

function head(eyebrow, d, home){
  return `<div class="p-head">
      <div>
        <div class="eyebrow">${eyebrow}</div>
        <h2>${d.name}</h2>
        <div class="coords">${d.place}<br>${fmtCoord(d)}${home ? "" : ` · ${miles(HOME, d).toLocaleString()} mi from Thornton`}</div>
      </div>
      <button class="close" id="closeBtn" type="button" aria-label="Close and return to the globe">×</button>
    </div>`;
}
function stampHtml(d, fresh){
  return `<div class="stamp${fresh ? " fresh" : ""}" aria-hidden="true"><span>Urban Bread Co</span><b>${d.name}</b><span>${today}</span></div>`;
}
function show(){
  document.getElementById("closeBtn").addEventListener("click", goHome);
  panel.scrollTop = 0;
  app.classList.remove("flying");
  app.classList.add("open");
  panel.setAttribute("aria-hidden", "false");
}

function openPanel(d){
  const value = valueOf(d), save = value - d.price;
  panelIn.innerHTML = `
    ${head("Taste of", d, d.id === "colorado")}
    <div class="sig">
      <div class="label">Signature bread</div>
      <h3>${d.sig}</h3>
      <p>${d.sigLine}</p>
    </div>
    <div class="facts">
      <div class="fact"><div class="label">Where it was born</div><p>${d.origin}</p></div>
      <div class="fact"><div class="label">The originator</div><p>${d.originator}</p></div>
      <div class="fact"><div class="label">What's in it</div><div class="chips">${d.ingredients.map(i => `<span>${i}</span>`).join("")}</div></div>
    </div>
    <div class="funfact"><div class="label">Fun fact</div><p>${d.fun}</p></div>
    <div class="box">
      <div class="label">The ${d.name} box · 4 minis</div>
      <ul>${d.box.map(b => `<li><span>${b[0]}</span><span>${b[1]} · $${MINI[b[1]]}</span></li>`).join("")}</ul>
      <div class="price"><b>$${d.price}</b><s>$${value} separately</s><em>You save $${save}</em></div>
      <a class="cta" href="${MENU}" target="_blank" rel="noopener">Order the ${d.name} box</a>
      <p class="note">Baked fresh to order in Thornton. Pickup or Denver metro delivery.</p>
    </div>`;
  show();
}

function openAtlas(d, home){
  const fresh = stamp(d.id);
  const r = regionOf(d.id);
  const neighbours = r.items.filter(a => a !== d);
  panelIn.innerHTML = `
    ${head(KIND[d.kind], d, home)}
    ${stampHtml(d, fresh)}
    <div class="funfact"><div class="label">The story</div><p>${d.note}</p></div>
    <div class="box">
      <div class="label">From here to your table · ${d.breads.length} bread${d.breads.length > 1 ? "s" : ""}</div>
      <ul class="atlas-list">${d.breads.map(b => `<li><div><strong>${b[0]}</strong><p>${b[2]}</p></div><span><em>${b[1]}</em>$${MINI[b[1]]} mini<br>$${FULL[b[1]]} full</span></li>`).join("")}</ul>
      <a class="cta" href="${MENU}" target="_blank" rel="noopener">Order from the menu</a>
    </div>
    ${neighbours.length ? `<div class="near"><div class="label">Nearby in ${r.name}</div><div class="near-row">${neighbours.map(a => `<button type="button" class="near-btn" data-id="${a.id}">${a.name}<small>${a.breads.length}</small></button>`).join("")}</div></div>` : ""}`;
  panelIn.querySelectorAll(".near-btn").forEach(b => b.addEventListener("click", () => select(byId[b.dataset.id])));
  show();
  const pin = document.getElementById("pin-" + d.id);
  if (pin) pin.classList.add("stamped");
}

function goHome(){
  clearTimers();
  current = null;
  app.classList.remove("open", "flying");
  panel.setAttribute("aria-hidden", "true");
  globe.arcsData([]).ringsData([]);
  if (mode === "atlas" && region){
    renderRail();
    updateLayer(true);
    globe.pointOfView({ lat: region.lat, lng: region.lng, altitude: region.alt }, reduced ? 0 : 1200);
    return;
  }
  renderRail();
  updateLayer(true);
  globe.pointOfView({ lat: HOME.lat - 8, lng: HOME.lng, altitude: isPhone() ? 3.2 : 2.5 }, reduced ? 0 : 1800);
  timers.push(setTimeout(() => { controls.autoRotate = !reduced; updateLayer(); }, 1900));
}

document.getElementById("homeBtn").addEventListener("click", () => { region = null; goHome(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && current) goHome(); });
</script>

</body></html>
